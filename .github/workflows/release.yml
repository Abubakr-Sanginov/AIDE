name: Release

# Push a tag like v0.2.3 (the same number as "version" in src-tauri/tauri.conf.json) to build the installer,
# sign the update package and publish the release. Installed apps then see the update: the updater reads
# latest.json from /releases/latest/download/, and the release is published (not a draft) so that URL resolves.
# Set releaseDraft to true if you prefer to review a release before apps can see it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AIDE ${{ github.ref_name }}
          releaseBody: See the changelog on the site. Installers are below; the app updates itself from this release.
          releaseDraft: false
          prerelease: false
